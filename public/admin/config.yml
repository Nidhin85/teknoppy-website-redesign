              - { name: badge, label: "Badge", widget: string }
              - { name: headingLead, label: "Heading — lead", widget: string }
              - { name: headingAccent, label: "Heading — accent", widget: string }
              - { name: headingRest, label: "Heading — rest", widget: string }
              - { name: intro, label: "Intro", widget: text }
