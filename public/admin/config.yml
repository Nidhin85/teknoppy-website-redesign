                  - { name: badge, label: "Badge", widget: string, required: false }
                  - { name: h1Lead, label: "H1 — lead", widget: string, required: false }
                  - { name: h1Accent, label: "H1 — highlighted", widget: string }
                  - { name: h1Rest, label: "H1 — rest", widget: string, required: false }
                  - { name: subhead, label: "Sub-headline (H2)", widget: string, required: false }
                  - name: body
                    label: "Body paragraphs"
                    widget: list
                    required: false
                    fields:
                      - { name: text, label: "Text", widget: text, required: false }
                      - { name: html, label: "HTML (use when the paragraph needs links)", widget: text, required: false }
                  - name: ctas
                    label: "Buttons"
                    widget: list
                    required: false
                    fields:
                      - { name: label, label: "Label", widget: string }
                      - { name: href, label: "URL", widget: string }
                  - name: stats
