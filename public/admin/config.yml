backend:
  name: github
  repo: Lymdata-Labs-Private-Limited/tekenoppy
  branch: main
  base_url: https://tekenoppy.vercel.app
  auth_endpoint: api/auth
  # Simple password login: clicking "Sign In with GitHub" at /admin/ opens a password
  # prompt served by /api/auth. Editors never touch GitHub. One-time owner setup:
  # set CMS_PASSWORD (any password) and CMS_GITHUB_TOKEN (a GitHub token with repo
  # Contents: read/write) in Vercel → Settings → Environment Variables, then redeploy.

# Lets you run the CMS locally against local files (npx @sveltia/cms-server) without login.
local_backend: true

media_folder: "public/uploads"
public_folder: "/uploads"

site_url: https://tekenoppy.vercel.app
display_url: https://tekenoppy.vercel.app
logo_url: /logo.svg

collections:
  - name: pages
    label: "Pages (Home & Service Pillars)"
    description: "Editable content for the homepage sections and the 5 service pillar pages."
    files:
      - name: home
        label: "Homepage"
        file: "src/data/home.json"
        fields:
          - name: hero
            label: "Hero"
            widget: object
            fields:
              - name: headlines
                label: "Headlines"
                widget: list
                fields:
                  - { name: lead, label: "Lead", widget: string }
                  - { name: highlight, label: "Highlight", widget: string }
              - { name: body, label: "Body", widget: text }
              - name: primaryCta
                label: "Primary CTA"
                widget: object
                fields:
                  - { name: label, label: "Label", widget: string }
                  - { name: href, label: "Href", widget: string }
              - name: secondaryCta
                label: "Secondary CTA"
                widget: object
                fields:
                  - { name: label, label: "Label", widget: string }
                  - { name: href, label: "Href", widget: string }
              - { name: trustedLabel, label: "Trusted Label", widget: string }
          - name: about
            label: "About"
            widget: object
            fields:
              - { name: badge, label: "Badge", widget: string }
              - { name: headingAccent, label: "Heading Accent", widget: string }
              - { name: headingRest, label: "Heading Rest", widget: string }
              - { name: intro, label: "Intro", widget: text }
              - name: paragraphs
                label: "Paragraphs"
                widget: list
                field: { label: "Paragraph", widget: text }
              - name: stats
                label: "Stats"
                widget: list
                fields:
                  - { name: value, label: "Value", widget: number }
                  - { name: suffix, label: "Suffix", widget: string }
                  - { name: label, label: "Label", widget: string }
                  - { name: sublabel, label: "Sublabel", widget: text }
          - name: services
            label: "Services"
            widget: object
            fields:
              - { name: badge, label: "Badge", widget: string }
              - { name: headingLead, label: "Heading Lead", widget: string }
              - { name: headingAccent1, label: "Heading Accent 1", widget: string }
