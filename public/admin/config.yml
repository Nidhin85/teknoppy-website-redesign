backend:
  name: github
  repo: Lymdata-Labs-Private-Limited/tekenoppy
  branch: main
  # No OAuth app needed — at /admin/ choose "Use Personal Access Token" and paste a
  # GitHub fine-grained PAT scoped to this repo with Contents: Read and write.

# Lets you run the CMS locally against local files (npx @sveltia/cms-server) without login.
local_backend: true

media_folder: "public/uploads"
public_folder: "/uploads"

site_url: https://tekenoppy.vercel.app
display_url: https://tekenoppy.vercel.app

collections:
  - name: pages
    label: "Pages (Home & Service Pillars)"
    description: "Editable content for the homepage sections and the 5 service pillar pages."
    files:
      - name: home
        label: "Homepage"
        file: "src/data/home.json"
        fields:
          - name: hero
            label: "Hero"
            widget: object
            fields:
              - name: headlines
                label: "Headlines"
                widget: list
                fields:
                  - { name: lead, label: "Lead", widget: string }
                  - { name: highlight, label: "Highlight", widget: string }
              - { name: body, label: "Body", widget: text }
              - name: primaryCta
                label: "Primary CTA"
                widget: object
                fields:
                  - { name: label, label: "Label", widget: string }
                  - { name: href, label: "Href", widget: string }
              - name: secondaryCta
                label: "Secondary CTA"
                widget: object
                fields:
                  - { name: label, label: "Label", widget: string }
                  - { name: href, label: "Href", widget: string }
              - { name: trustedLabel, label: "Trusted Label", widget: string }
          - name: about
            label: "About"
            widget: object
            fields:
              - { name: badge, label: "Badge", widget: string }
              - { name: headingAccent, label: "Heading Accent", widget: string }
              - { name: headingRest, label: "Heading Rest", widget: string }
              - { name: intro, label: "Intro", widget: text }
              - name: paragraphs
                label: "Paragraphs"
                widget: list
                field: { label: "Paragraph", widget: text }
              - name: stats
                label: "Stats"
                widget: list
                fields:
                  - { name: value, label: "Value", widget: number }
                  - { name: suffix, label: "Suffix", widget: string }
                  - { name: label, label: "Label", widget: string }
                  - { name: sublabel, label: "Sublabel", widget: text }
          - name: services
            label: "Services"
            widget: object
            fields:
              - { name: badge, label: "Badge", widget: string }
              - { name: headingLead, label: "Heading Lead", widget: string }
              - { name: headingAccent1, label: "Heading Accent 1", widget: string }
              - { name: headingMid, label: "Heading Mid", widget: string }
              - { name: headingAccent2, label: "Heading Accent 2", widget: string }
              - { name: headingRest, label: "Heading Rest", widget: string }
              - { name: intro, label: "Intro", widget: text }
              - name: cards
                label: "Cards"
                widget: list
                fields:
                  - { name: title, label: "Title", widget: string }
                  - { name: description, label: "Description", widget: text }
                  - { name: linkText, label: "Link Text", widget: string }
                  - { name: href, label: "Href", widget: string }
          - name: whyChooseUs
            label: "Why Choose Us"
            widget: object
            fields:
              - { name: badge, label: "Badge", widget: string }
              - { name: headingLead, label: "Heading Lead", widget: string }
              - { name: headingAccent, label: "Heading Accent", widget: string }
              - { name: headingRest, label: "Heading Rest", widget: string }
              - { name: intro, label: "Intro", widget: text }
              - name: features
                label: "Features"
                widget: list
                fields:
                  - { name: title, label: "Title", widget: string }
                  - { name: description, label: "Description", widget: text }
          - name: faq
            label: "FAQ"
            widget: object
            fields:
              - { name: badge, label: "Badge", widget: string }
              - { name: headingLead, label: "Heading Lead", widget: string }
              - { name: headingAccent, label: "Heading Accent", widget: string }
              - { name: intro, label: "Intro", widget: text }
              - name: items
                label: "Items"
                widget: list
                fields:
                  - { name: question, label: "Question", widget: string }
                  - { name: answer, label: "Answer", widget: text }
      - name: web_design
