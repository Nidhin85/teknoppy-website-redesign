  - name: settings
    label: "Site Settings"
    description: "Global contact details used across the site (footer, contact page, mobile bar, schema)."
    files:
      - name: footer
        label: "Footer"
        file: "src/data/footer.json"
        fields:
          - { name: tagline, label: "Tagline", widget: text }
          - name: columns
            label: "Link columns"
            widget: list
            fields:
              - { name: heading, label: "Column heading", widget: string }
              - name: links
                label: "Links"
                widget: list
                fields:
                  - { name: label, label: "Label", widget: string }
                  - { name: href, label: "URL", widget: string, hint: "Only link to pages that exist — dead links hurt SEO on every page." }
          - { name: serviceAreas, label: "Areas we serve", widget: string }
          - name: legal
            label: "Legal links (bottom bar)"
            widget: list
            required: false
            fields:
              - { name: label, label: "Label", widget: string }
              - { name: href, label: "URL", widget: string }
      - name: site
        label: "Site & Contact"
        file: "src/data/site.json"
        fields:
          - { name: businessName, label: "Business name", widget: string }
          - { name: phone, label: "Phone (display)", widget: string }
          - { name: phoneLink, label: "Phone for tel: link", widget: string, hint: "Digits with country code, no spaces — e.g. +916282249224" }
          - { name: whatsapp, label: "WhatsApp number", widget: string, hint: "Digits with country code, no plus — e.g. 916282249224" }
          - { name: email, label: "Email", widget: string }
          - { name: address, label: "Full address", widget: text }
          - { name: addressShort, label: "Short address", widget: string }
          - { name: founderName, label: "Founder name", widget: string }
          - { name: founderRole, label: "Founder role", widget: string }
          - { name: established, label: "Established year", widget: string }
          - name: social
            label: "Social links"
            widget: object
            fields:
              - { name: twitter, label: "Twitter / X URL", widget: string, required: false }
              - { name: linkedin, label: "LinkedIn URL", widget: string, required: false }
              - { name: instagram, label: "Instagram URL", widget: string, required: false }
